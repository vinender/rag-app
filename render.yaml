# Render Blueprint — FastAPI RAG backend (Docker).
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo.
# Reuses your existing Neon Postgres (pgvector) — set DATABASE_URL to the Neon
# connection string and OPENAI_API_KEY in the service env after it provisions.
services:
  - type: web
    name: rag-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
